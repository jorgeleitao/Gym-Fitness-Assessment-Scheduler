[package]
name = "painel-avaliacoes"
version = "1.0.0"
description = "Painel de Avaliações (white label) - versão desktop"
authors = ["Jorge Leitão"]
edition = "2021"
rust-version = "1.90"

[lib]
name = "painel_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
serde_json = "1"

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
url = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
